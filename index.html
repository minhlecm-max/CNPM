<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menu - Nhà Hàng</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding-top: 90px;
            padding-bottom: 30px;
        }

        .navbar {
            background: white !important;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: #667eea !important;
        }

        .card {
            border: none;
            border-radius: 20px;
            background: linear-gradient(180deg, #ffffff, #f8f9ff);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h4 {
            font-weight: 800;
            color: #4f46e5;
        }

        label {
            color: #555;
            font-weight: 600;
        }

        #table-input {
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #e0e7ff;
            transition: all 0.25s ease;
        }

        #table-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.25);
            outline: none;
        }

        #qrcode {
            display: inline-block;
            padding: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeInScale 0.4s ease;
        }

        #qrcode img,
        #qrcode canvas {
            border-radius: 12px;
        }

        p.text-muted {
            font-size: 0.9rem;
        }

        .instruction {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .instruction h5 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .instruction ol {
            margin-bottom: 0;
            padding-left: 20px;
        }

        .instruction li {
            color: #555;
            margin-bottom: 8px;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar fixed-top shadow-sm">
        <div class="container">
            <span class="navbar-brand">🍽️ Nhà Hàng - Tạo QR Code</span>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 shadow-lg" style="max-width:450px;width:100%">
            <h4 class="text-center mb-3">
                <i class="fas fa-qrcode"></i> Tạo QR Code Cho Bàn
            </h4>

            <label class="form-label">Số bàn</label>
            <input
                type="number"
                id="table-input"
                class="form-control mb-3"
                placeholder="Nhập số bàn (Ví dụ: 1)"
                min="1"
            >

            <div class="text-center mt-3">
                <div id="qrcode"></div>
                <p class="text-muted mt-2" id="qr-info">Nhập số bàn để tạo QR Code</p>
            </div>

            <div class="instruction">
                <h5><i class="fas fa-info-circle"></i> Hướng dẫn sử dụng</h5>
                <ol>
                    <li>Nhập số bàn vào ô trên</li>
                    <li>QR Code sẽ được tạo tự động</li>
                    <li>In hoặc chụp lại QR Code</li>
                    <li>Đặt QR Code trên bàn tương ứng</li>
                    <li>Khách hàng quét QR để gọi món</li>
                </ol>
            </div>

            <button class="btn btn-primary w-100 mt-3" onclick="downloadQR()">
                <i class="fas fa-download"></i> Tải QR Code
            </button>
        </div>
    </div>

    <script src="/static/cart.js"></script>


    <script>
        const qrContainer = document.getElementById('qrcode');
        const tableInput = document.getElementById('table-input');
        const qrInfo = document.getElementById('qr-info');

        let qrCode = new QRCode(qrContainer, {
            width: 220,
            height: 220,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function updateQR(table) {
            if (!table) {
                qrInfo.textContent = "Nhập số bàn để tạo QR Code";
                return;
            }

            const basePath = location.pathname.replace(/\/[^\/]*$/, '');
            const url = `http://192.168.1.10:5500/menu.html?table=${table}`;



            qrCode.clear();
            qrCode.makeCode(url);
            
            qrInfo.innerHTML = `QR Code cho <strong>Bàn ${table}</strong>`;
        }

        tableInput.addEventListener('input', () => {
            const table = tableInput.value.trim();
            if (table) {
                updateQR(table);
            }
        });

        // Khởi tạo với bàn số 1
        tableInput.value = 1;
        updateQR(1);

        // Hàm tải QR Code
        function downloadQR() {
            const table = tableInput.value.trim();
            if (!table) {
                alert('Vui lòng nhập số bàn trước!');
                return;
            }

            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                alert('Không tìm thấy QR Code!');
                return;
            }

            // Tạo canvas mới với text
            const newCanvas = document.createElement('canvas');
            const ctx = newCanvas.getContext('2d');
            
            newCanvas.width = 300;
            newCanvas.height = 350;

            // Nền trắng
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);

            // Vẽ QR code
            ctx.drawImage(canvas, 40, 40, 220, 220);

            // Thêm text
            ctx.fillStyle = '#667eea';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`Bàn ${table}`, 150, 290);

            ctx.fillStyle = '#555';
            ctx.font = '16px Arial';
            ctx.fillText('Quét QR để gọi món', 150, 320);

            // Download
            const link = document.createElement('a');
            link.download = `QR_Ban_${table}.png`;
            link.href = newCanvas.toDataURL();
            link.click();
        }
    </script>

</body>

</html>
